<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>GiVo Stream Receiver</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    cast-media-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                        --background-color: #000; --splash-color: #000; }
  </style>

  <!-- Google Cast Application Framework (CAF) v3 receiver runtime. -->
  <script type="text/javascript"
          src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <!-- hls.js — pinned. It demuxes MPEG-TS-HLS natively (transmux → fMP4 in JS →
       MSE), which the Default Media Receiver's Shaka cannot do for our live
       relay. This is the whole reason for the custom receiver. If an OLD
       Chromecast (gen 1/2) chokes on 1.5.x, drop the pin to hls.js@1.4.14. -->
  <script type="text/javascript"
          src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <!-- CAF renders a <video> inside this element; hls.js attaches to it (see
       receiver.js). Keeping <cast-media-player> gives us CAF's session/state
       management + the metadata card (channel name + logo the sender sets). -->
  <cast-media-player></cast-media-player>

  <script type="text/javascript" src="receiver.js?v=20260702b"></script>
</body>
</html>
